<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grandpa's Sidekick</title>
  <meta name="viewport" content="width=800, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      --bg: {{ theme.bg }};
      --surface: {{ theme.surface }};
      --border: {{ theme.border }};
      --text: {{ theme.text }};
      --muted: {{ theme.muted }};
      --subtle: {{ theme.subtle }};
      --accent: {{ theme.accent }};
      --warm: {{ theme.warm }};
      --cool: {{ theme.cool }};
      --good: {{ theme.good }};
      --good-strong: {{ theme.good_strong }};
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    window.__GPS_CONFIG__ = {
      names: {{ names|tojson }},
      aboutNote: {{ about_note|tojson }}
    };
  </script>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div class="header-left">
        <div id="clock" tabindex="0">--:-- --</div>
        <div class="header-text">
          <div id="greeting"></div>
          <div id="date">Loading…</div>
        </div>
      </div>
      <div class="header-right">
        <div id="cur-weather">
          <span id="cur-emoji">🌡️</span>
          <div class="cur-stack">
            <span id="cur-temp">--°</span>
            <span id="cur-label">{{ config.weather.label or '' }}</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="calendar-panel" class="panel">
        <h2>Today &amp; Upcoming</h2>
        <div id="event-list">Loading…</div>
      </section>

      <section id="news-panel" class="panel">
        <h2 id="news-header">News <span class="src-name" id="news-source">—</span></h2>
        <div id="news-card">
          <div id="news-image"></div>
          <div id="news-title">Loading…</div>
        </div>
        <div id="news-dots"></div>
      </section>
    </main>

    <div id="quote-strip"></div>

    <footer id="forecast-strip">
      <div id="forecast-days">Loading…</div>
    </footer>

    <div id="status-bar"></div>
  </div>

  <!-- Detail view (overlays home; populated dynamically) -->
  <div id="detail-view" class="hidden" role="dialog">
    <div class="detail-header">
      <button id="detail-back" type="button">← Home</button>
      <div id="detail-title"></div>
      <div id="detail-nav"></div>
    </div>
    <div id="detail-body"></div>
    <div id="detail-timer" aria-hidden="true"></div>
  </div>

  <!-- Seasonal sparkles overlay (positioned absolutely; never blocks taps) -->
  <div id="sparkles" aria-hidden="true"></div>

  <!-- Secret tap menu (hidden until clock tapped 5x) -->
  <div id="secret-menu" class="hidden" role="dialog" aria-hidden="true">
    <div class="secret-card">
      <div class="secret-emoji">❤️</div>
      <div class="secret-note" id="secret-note">A note from Kyle</div>
      <div class="secret-meta" id="secret-meta">…</div>
      <div class="secret-tap-hint">tap anywhere to close</div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
